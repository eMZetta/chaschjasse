<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Erfolg "Monsterstich" (49+ Punkte in einem Stich): vier Karten im Stich und 49+-Plakette -->
  <defs>
    <radialGradient id="rim" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.45" stop-color="#e6b23a"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </radialGradient>
    <radialGradient id="felt" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2f7a46"/>
      <stop offset="1" stop-color="#123b22"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#ebe0c6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#d79a22"/>
      <stop offset="1" stop-color="#9a6510"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2452f"/>
      <stop offset="1" stop-color="#9c2414"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="122" fill="#5a3a0c"/>
  <circle cx="128" cy="128" r="117" fill="url(#rim)"/>
  <circle cx="128" cy="128" r="98" fill="#6b4512"/>
  <circle cx="128" cy="128" r="95" fill="url(#felt)"/>

  <!-- vier Karten im Stich -->
  <g>
    <g transform="rotate(-6 128 76)">
      <rect x="106" y="44" width="44" height="64" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="128.0" y="86.1" font-size="28" fill="#c8331f" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">10</text>
      <text x="115" y="59" font-size="11" fill="#c8331f" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">10</text>
    </g>
    <g transform="rotate(84 164 110)">
      <rect x="142" y="78" width="44" height="64" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="164.0" y="120.1" font-size="28" fill="#d79a22" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">U</text>
      <text x="151" y="93" font-size="11" fill="#d79a22" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">U</text>
    </g>
    <g transform="rotate(4 128 140)">
      <rect x="106" y="108" width="44" height="64" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="128.0" y="150.1" font-size="28" fill="#2a2a2a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
      <text x="115" y="123" font-size="11" fill="#2a2a2a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
    </g>
    <g transform="rotate(-80 92 108)">
      <rect x="70" y="76" width="44" height="64" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="92.0" y="118.1" font-size="28" fill="#2f7a46" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">A</text>
      <text x="79" y="91" font-size="11" fill="#2f7a46" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">A</text>
    </g>
  </g>

  <!-- Punkte-Plakette -->
  <polygon points="128.0,138.0 133.7,147.6 142.5,140.9 144.1,151.9 154.9,149.1 152.1,159.9 163.1,161.5 156.4,170.3 166.0,176.0 156.4,181.7 163.1,190.5 152.1,192.1 154.9,202.9 144.1,200.1 142.5,211.1 133.7,204.4 128.0,214.0 122.3,204.4 113.5,211.1 111.9,200.1 101.1,202.9 103.9,192.1 92.9,190.5 99.6,181.7 90.0,176.0 99.6,170.3 92.9,161.5 103.9,159.9 101.1,149.1 111.9,151.9 113.5,140.9 122.3,147.6" fill="url(#ribbon)" stroke="#5a1408" stroke-width="3" stroke-linejoin="round"/>
  <text x="128" y="187" font-size="30" fill="#fff3d0" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">49+</text>

  <!-- Glanz auf dem Rand -->
  <path d="M40 98 A95 95 0 0 1 112 30" fill="none" stroke="#fff8d6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
