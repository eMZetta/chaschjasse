    <polygon points="102,66.2 105.2,74.8 114.4,75.2 107.2,80.9 109.6,89.7 102,84.7 94.4,89.7 96.8,80.9 89.6,75.2 98.8,74.8" fill="url(#metal)" stroke="#3a2406" stroke-width="2" stroke-linejoin="round"/>
