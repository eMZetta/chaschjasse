<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Erfolg "Wer klopft da?": Faust klopft auf den Holztisch -->
  <defs>
    <radialGradient id="rim" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.45" stop-color="#e6b23a"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </radialGradient>
    <radialGradient id="felt" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2f7a46"/>
      <stop offset="1" stop-color="#123b22"/>
    </radialGradient>
    <clipPath id="inner"><circle cx="128" cy="128" r="95"/></clipPath>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d2b0"/><stop offset="0.6" stop-color="#e3a97f"/><stop offset="1" stop-color="#c98a60"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58b4d"/><stop offset="0.5" stop-color="#9c6630"/><stop offset="1" stop-color="#5f3c18"/></linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b3261e"/><stop offset="0.5" stop-color="#e0463a"/><stop offset="1" stop-color="#8f1b15"/></linearGradient>
  </defs>

  <circle cx="128" cy="128" r="122" fill="#5a3a0c"/>
  <circle cx="128" cy="128" r="117" fill="url(#rim)"/>
  <circle cx="128" cy="128" r="98" fill="#6b4512"/>
  <circle cx="128" cy="128" r="95" fill="url(#felt)"/>
  <g clip-path="url(#inner)">
    <!-- Tischplatte -->
    <rect x="20" y="178" width="216" height="70" fill="url(#wood)"/>
    <path d="M20 178 H236" stroke="#e8b878" stroke-width="3"/>
    <g stroke="#4a2c10" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M30 196 q40 -6 80 0 t90 -2 M24 212 q50 6 100 0 t100 2 M40 230 q60 -5 120 0"/>
    </g>
    <!-- Aufprall: Ringe, Zacken, Splitter -->
    <g fill="none" stroke="#fff3c4" stroke-linecap="round" stroke-width="4">
      <path d="M58 176 q-14 -4 -22 -18 M70 170 q-12 -10 -14 -26"/>
      <path d="M198 176 q14 -4 22 -18 M186 170 q12 -10 14 -26"/>
    </g>
    <path d="M44 184 q84 -22 168 0" stroke="#fff3c4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
    <g fill="#ffe08a" stroke="#b9801a" stroke-width="1.2" stroke-linejoin="round">
      <path d="M46 126 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 Z"/>
      <path d="M208 120 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/>
    </g>
    <!-- Aermel -->
    <path d="M94 22 H162 L166 100 H90 Z" fill="url(#sleeve)" stroke="#5a0f0a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M91 92 H165 L166 108 H90 Z" fill="#f4efe6" stroke="#8a8478" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M110 26 l-1 62 M128 24 v64 M146 26 l1 62" stroke="#fff" stroke-width="2" opacity="0.18"/>
    <!-- Faust (Fingerruecken zum Betrachter) -->
    <path d="M86 128 C84 112 88 104 100 104 H156 C168 104 172 112 170 128 L170 160 C170 172 162 178 150 178 H106 C94 178 86 172 86 160 Z" fill="url(#skin)" stroke="#7a4a2a" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="url(#skin)" stroke="#7a4a2a" stroke-width="3">
      <rect x="88" y="118" width="19" height="48" rx="9.5"/>
      <rect x="108" y="114" width="20" height="52" rx="10"/>
      <rect x="129" y="114" width="20" height="52" rx="10"/>
      <rect x="150" y="118" width="19" height="48" rx="9.5"/>
    </g>
    <g stroke="#a86a44" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M93 134 h9 M114 130 h9 M135 130 h9 M155 134 h9"/>
    </g>
    <!-- Daumen quer ueber die Finger -->
    <path d="M92 150 C100 142 140 142 160 150 C166 156 164 166 154 168 C130 172 106 172 96 166 C88 162 88 154 92 150 Z" fill="url(#skin)" stroke="#7a4a2a" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="108" cy="150" rx="12" ry="4" fill="#fff" opacity="0.32" transform="rotate(-6 108 150)"/>
    <ellipse cx="118" cy="122" rx="3.4" ry="9" fill="#fff" opacity="0.3"/>
    <ellipse cx="139" cy="122" rx="3.4" ry="9" fill="#fff" opacity="0.3"/>
  </g>
  <path d="M40 98 A95 95 0 0 1 112 30" fill="none" stroke="#fff8d6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
