<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Erfolg "Nell-Gigant" (150 Punkte mit vier Neunen): vier grosse Neuner und 150er-Banner -->
  <defs>
    <radialGradient id="rim" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.45" stop-color="#e6b23a"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </radialGradient>
    <radialGradient id="felt" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#7a3a8a"/>
      <stop offset="1" stop-color="#331540"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#ebe0c6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#d79a22"/>
      <stop offset="1" stop-color="#9a6510"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2452f"/>
      <stop offset="1" stop-color="#9c2414"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="122" fill="#5a3a0c"/>
  <circle cx="128" cy="128" r="117" fill="url(#rim)"/>
  <circle cx="128" cy="128" r="98" fill="#6b4512"/>
  <circle cx="128" cy="128" r="95" fill="url(#felt)"/>

  <!-- vier Neuner, gross gefaechert -->
  <g>
    <g transform="rotate(-27 128 220)">
      <rect x="99" y="66" width="58" height="90" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="128.0" y="129.7" font-size="52" fill="#c8331f" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
      <text x="108" y="81" font-size="11" fill="#c8331f" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
    </g>
    <g transform="rotate(-9 128 220)">
      <rect x="99" y="66" width="58" height="90" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="128.0" y="129.7" font-size="52" fill="#d79a22" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
      <text x="108" y="81" font-size="11" fill="#d79a22" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
    </g>
    <g transform="rotate(9 128 220)">
      <rect x="99" y="66" width="58" height="90" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="128.0" y="129.7" font-size="52" fill="#2a2a2a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
      <text x="108" y="81" font-size="11" fill="#2a2a2a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
    </g>
    <g transform="rotate(27 128 220)">
      <rect x="99" y="66" width="58" height="90" rx="6" fill="url(#card)" stroke="#5b4628" stroke-width="2.5"/>
      <text x="128.0" y="129.7" font-size="52" fill="#2f7a46" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
      <text x="108" y="81" font-size="11" fill="#2f7a46" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">9</text>
    </g>
  </g>
  <path d="M54 107 L56.52 113.48 L63 116 L56.52 118.52 L54 125 L51.48 118.52 L45 116 L51.48 113.48Z" fill="#fff3c4"/>
  <path d="M202 103 L204.52 109.48 L211 112 L204.52 114.52 L202 121 L199.48 114.52 L193 112 L199.48 109.48Z" fill="#fff3c4"/>

  <!-- Punkte-Banner -->
  <g>
    <path d="M58.0 172.0 H80.0 V208.0 H58.0 L67.0 190.0Z" fill="#7a1a0e"/>
    <path d="M198.0 172.0 H176.0 V208.0 H198.0 L189.0 190.0Z" fill="#7a1a0e"/>
    <rect x="72.0" y="166.0" width="112" height="36" rx="3" fill="url(#ribbon)" stroke="#5a1408" stroke-width="2"/>
    <text x="128" y="194.8" font-size="30" fill="#fff3d0" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">150</text>
  </g>

  <!-- Glanz auf dem Rand -->
  <path d="M40 98 A95 95 0 0 1 112 30" fill="none" stroke="#fff8d6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
