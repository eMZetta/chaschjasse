<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Erfolg "Vier Farben" (jede der 4 Farben als Trumpf angesagt): Eichel, Rosen, Schilten und Schellen im 2x2-Raster -->
  <defs>
    <radialGradient id="rim" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.45" stop-color="#e6b23a"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </radialGradient>
    <radialGradient id="felt" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2f7a46"/>
      <stop offset="1" stop-color="#123b22"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#ebe0c6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#d79a22"/>
      <stop offset="1" stop-color="#9a6510"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="122" fill="#5a3a0c"/>
  <circle cx="128" cy="128" r="117" fill="url(#rim)"/>
  <circle cx="128" cy="128" r="98" fill="#6b4512"/>
  <circle cx="128" cy="128" r="95" fill="url(#felt)"/>

  <!-- vier Kacheln -->
  <g fill="url(#card)" stroke="#5b4628" stroke-width="2.5">
    <rect x="67" y="67" width="58" height="58" rx="8"/>
    <rect x="131" y="67" width="58" height="58" rx="8"/>
    <rect x="67" y="131" width="58" height="58" rx="8"/>
    <rect x="131" y="131" width="58" height="58" rx="8"/>
  </g>

  <!-- Eichel, Rosen, Schilten, Schellen -->
    <g transform="translate(96 96) scale(1.2)">
      <path d="M0 -12 L4 -21" fill="none" stroke="#2f7a46" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="0" cy="6" rx="12" ry="15" fill="#8a5a22" stroke="#3a2406" stroke-width="2.5"/>
      <ellipse cx="-4" cy="4" rx="3" ry="6" fill="#c08a4a"/>
      <path d="M-16 -3 C-16 -17 16 -17 16 -3 Z" fill="#2f7a46" stroke="#173f24" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(160 96) scale(1.2)">
      <polygon points="1.0,-7.9 11.2,-15.4 7.2,-3.4" fill="#2f7a46" stroke="#173f24" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="7.9,-1.5 18.1,5.9 5.5,5.8" fill="#2f7a46" stroke="#173f24" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="3.8,7.0 0.0,19.0 -3.8,7.0" fill="#2f7a46" stroke="#173f24" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="-5.5,5.8 -18.1,5.9 -7.9,-1.5" fill="#2f7a46" stroke="#173f24" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="-7.2,-3.4 -11.2,-15.4 -1.0,-7.9" fill="#2f7a46" stroke="#173f24" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="0" cy="-9" r="9" fill="#c8331f" stroke="#7a1a0e" stroke-width="2"/>
      <circle cx="8.6" cy="-2.8" r="9" fill="#c8331f" stroke="#7a1a0e" stroke-width="2"/>
      <circle cx="5.3" cy="7.3" r="9" fill="#c8331f" stroke="#7a1a0e" stroke-width="2"/>
      <circle cx="-5.3" cy="7.3" r="9" fill="#c8331f" stroke="#7a1a0e" stroke-width="2"/>
      <circle cx="-8.6" cy="-2.8" r="9" fill="#c8331f" stroke="#7a1a0e" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffd34a" stroke="#9a6510" stroke-width="2"/>
    </g>
    <g transform="translate(96 160) scale(1.2)">
      <path d="M-15 -17 H15 V0 C15 12 6 18 0 21 C-6 18 -15 12 -15 0 Z" fill="#f0c43a"/>
      <rect x="-15" y="-17" width="30" height="13" fill="#2a2a2a"/>
      <path d="M-15 -17 H15 V0 C15 12 6 18 0 21 C-6 18 -15 12 -15 0 Z" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g transform="translate(160 160) scale(1.2)">
      <circle cx="0" cy="-17" r="4" fill="none" stroke="#5a3a0c" stroke-width="2.5"/>
      <circle cx="0" cy="2" r="16" fill="url(#gold)" stroke="#5a3a0c" stroke-width="2.5"/>
      <path d="M-15 -2 Q0 4 15 -2" fill="none" stroke="#5a3a0c" stroke-width="2.5"/>
      <circle cx="0" cy="8" r="3.5" fill="#3a2406"/>
      <path d="M0 9 V17" stroke="#3a2406" stroke-width="3" stroke-linecap="round"/>
    </g>

  <!-- Glanz auf dem Rand -->
  <path d="M40 98 A95 95 0 0 1 112 30" fill="none" stroke="#fff8d6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
